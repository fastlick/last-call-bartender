<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#21192c"><title>LAST CALL | Pixel Bartender</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17121e;color:#fbe6bd;font:14px system-ui,sans-serif}main{max-width:490px;margin:auto;background:#292037;min-height:100dvh;padding-bottom:22px}header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#181421;border-bottom:3px solid #a56b63}h1{font-size:20px;margin:0;color:#ffcf82}.small{font-size:11px;color:#cbb5ba}canvas{display:block;width:100%;image-rendering:pixelated;background:#352b43}.stats{display:flex;justify-content:space-between;padding:9px 13px;background:#49354d}.card{background:#1e1a2c;margin:10px;padding:12px;border:2px solid #986b73;border-radius:8px}.card h2{margin:0 0 6px;color:#ffd38c;font-size:17px}.card p{font-size:12px;line-height:1.5}.track{height:8px;background:#59485a;border-radius:6px;overflow:hidden}.track div{height:100%;background:#8dd3ac;width:100%}.controls{padding:0 10px}.label{font-size:12px;color:#e7bb86;margin:14px 0 7px;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{border:2px solid #a47a8d;border-bottom-width:4px;border-radius:8px;background:#58445f;color:#fff0d2;font:inherit;font-size:12px;min-height:53px;padding:7px;touch-action:none;cursor:pointer}button:active{transform:translateY(2px)}button.active{background:#966b52;border-color:#ffd18b}button strong{display:block;color:#ffd18b;font-size:15px}button:disabled{opacity:.4}#pour{width:100%;margin-top:8px;background:#9a6d47;border-color:#eec381;font-weight:700}#serve{background:#47765b;border-color:#8dc89e}#reset{background:#855654;border-color:#d99b8a}.feedback{margin:12px 10px;padding:12px;background:#1b1827;border-left:4px solid #e7b87b;font-size:12px;min-height:50px}.overlay{position:fixed;inset:0;background:#0e0a17e9;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.dialog{background:#30253b;border:3px solid #efbd7b;border-radius:12px;padding:20px;width:min(400px,100%);text-align:center}.dialog h2{color:#ffce86}.dialog button{width:100%;background:#46785d}.score{font-size:42px;font-weight:900;color:#ffcd85}.hint{font-size:11px;color:#c6b5c8;margin-top:5px}
</style></head><body><main><header><div><h1>🍸 LAST CALL</h1><div class="small">PIXEL BARTENDER · CA ĐÊM</div></div><div style="text-align:right"><b id="money">0 xu</b><div class="small" id="count">0 khách</div></div></header>
<canvas id="scene" width="320" height="185"></canvas><div class="stats"><span id="volume">🥃 0 ml</span><span id="tech">Lắc 0 · Khuấy 0</span><span id="timer">0s</span></div>
<section class="card"><h2 id="customer"></h2><p id="order"></p><div class="track"><div id="bar"></div></div><p id="contents">Ly trống</p></section>
<div class="controls"><div class="label">① CHỌN NGUYÊN LIỆU VÀ GIỮ NÚT RÓT</div><div class="grid" id="ingredients"></div><button id="pour" disabled>CHỌN NGUYÊN LIỆU</button><div class="hint">Giữ để rót 2 ml mỗi nhịp, thả khi đạt định lượng.</div>
<div class="label">② KỸ THUẬT PHA CHẾ</div><div class="tools"><button id="ice">🧊<strong>Đá</strong></button><button id="shake">🥤<strong>Lắc</strong></button><button id="stir">🥄<strong>Khuấy</strong></button><button id="garnish">🍋<strong>Garnish</strong></button></div>
<div class="bottom"><button id="serve">✓ PHỤC VỤ</button><button id="reset">↺ LÀM LẠI</button></div></div><div class="feedback" id="feedback">Chào mừng! Hãy pha đồ uống đầu tiên.</div></main>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="resultTitle"></h2><div class="score" id="score"></div><p id="details"></p><button id="next">KHÁCH TIẾP THEO →</button></div></div>
<script>
'use strict';
const recipes=[
{name:'SUNSET FIZZ',guest:'Mai',items:{Cam:60,Chanh:20,Soda:90,Siro:15},method:'stir',steps:5,garnish:'Cam',time:120},
{name:'BERRY BREEZE',guest:'An',items:{Dâu:70,Chanh:15,Soda:80,Siro:10},method:'shake',steps:6,garnish:'Dâu',time:125},
{name:'GOLDEN HOUR',guest:'Khánh',items:{Cam:50,Dâu:30,Soda:100,Siro:10},method:'stir',steps:7,garnish:'Chanh',time:130}];
const colors={Cam:'#f5a14c',Chanh:'#d7df6c',Soda:'#a6d8ed',Siro:'#b55f92',Dâu:'#d95372'};
const $=id=>document.getElementById(id);let idx=0,cash=0,served=0,selected=null,liquid={},ice=false,shake=0,stir=0,garnish=null,started=Date.now(),finished=false,pourInterval=null;
const recipe=()=>recipes[idx%recipes.length],total=()=>Object.values(liquid).reduce((a,b)=>a+b,0),say=s=>$('feedback').textContent=s;
function refresh(){ $('volume').textContent='🥃 '+total()+' ml'+(ice?' · 🧊':'');$('tech').textContent='Lắc '+shake+' · Khuấy '+stir;$('contents').textContent=Object.entries(liquid).map(([k,v])=>k+' '+v+'ml').join(' · ')||'Ly trống';$('pour').textContent=selected?'GIỮ ĐỂ RÓT '+selected.toUpperCase()+' · '+(liquid[selected]||0)+' ml':'CHỌN NGUYÊN LIỆU';$('pour').disabled=!selected||finished;$('garnish').innerHTML='🍋<strong>'+(garnish||'Garnish')+'</strong>';document.querySelectorAll('[data-name]').forEach(b=>b.classList.toggle('active',b.dataset.name===selected));}
function clearGlass(){selected=null;liquid={};ice=false;shake=0;stir=0;garnish=null;finished=false;refresh();}
function nextOrder(){clearGlass();started=Date.now();const r=recipe();$('customer').textContent='🛎 '+r.guest+' | '+r.name;$('order').textContent=Object.entries(r.items).map(([k,v])=>k+' '+v+'ml').join(' · ')+' · '+(r.method==='shake'?'Lắc ':'Khuấy ')+r.steps+' lần · Đá · Trang trí '+r.garnish;$('overlay').classList.remove('show');say('Khách mới đến! Hãy chọn nguyên liệu và pha đúng công thức.');}
$('ingredients').innerHTML=Object.keys(colors).map(n=>'<button data-name="'+n+'"><strong style="color:'+colors[n]+'">● '+n+'</strong><small>Nguyên liệu</small></button>').join('');
document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{selected=b.dataset.name;refresh();say('Đã chọn '+selected+'. Giữ nút RÓT để đong.')});
function stopPour(){if(pourInterval){clearInterval(pourInterval);pourInterval=null;}}
function addPour(){if(!selected||finished)return;liquid[selected]=Math.min(400,(liquid[selected]||0)+2);refresh();}
$('pour').addEventListener('pointerdown',e=>{e.preventDefault();if(!selected||finished)return;stopPour();addPour();pourInterval=setInterval(addPour,80);});
['pointerup','pointercancel','pointerleave'].forEach(e=>$('pour').addEventListener(e,stopPour));window.addEventListener('pointerup',stopPour);
$('ice').onclick=()=>{ice=true;refresh();say('Đã thêm đá.')};$('shake').onclick=()=>{shake++;refresh();say('Lắc '+shake+' lần.')};$('stir').onclick=()=>{stir++;refresh();say('Khuấy '+stir+' lần.')};
$('garnish').onclick=()=>{const a=[null,'Cam','Chanh','Dâu'];garnish=a[(a.indexOf(garnish)+1)%a.length];refresh();say('Trang trí: '+(garnish||'không'))};$('reset').onclick=()=>{clearGlass();say('Đã thay ly mới. Đồng hồ vẫn chạy!')};
$('serve').onclick=()=>{if(finished)return;finished=true;stopPour();const r=recipe(),keys=new Set([...Object.keys(r.items),...Object.keys(liquid)]);let error=0;keys.forEach(k=>error+=Math.abs((r.items[k]||0)-(liquid[k]||0)));const required=Object.values(r.items).reduce((a,b)=>a+b,0),a=Math.max(0,Math.round(45*(1-error/(required*1.4)))),steps=r.method==='shake'?shake:stir,other=r.method==='shake'?stir:shake;let b=Math.max(0,Math.round(30*(1-Math.abs(steps-r.steps)/r.steps-other*.12)));if(!ice)b=Math.max(0,b-8);const c=garnish===r.garnish?15:garnish?6:0,elapsed=(Date.now()-started)/1000,d=Math.max(0,Math.round(10*(1-Math.max(0,elapsed-r.time/2)/(r.time/2)))),score=Math.min(100,a+b+c+d),pay=score>=50?25:10,tip=Math.round(score/12);cash+=pay+tip;served++;$('money').textContent=cash+' xu';$('count').textContent=served+' khách';$('resultTitle').textContent=score>=90?'🌟 XUẤT SẮC':score>=70?'✨ HÀI LÒNG':score>=50?'🙂 CẦN LUYỆN THÊM':'💔 CHƯA ĐẠT';$('score').textContent=score+'/100';$('details').innerHTML='Định lượng: '+a+'/45<br>Kỹ thuật: '+b+'/30<br>Trang trí: '+c+'/15<br>Tốc độ: '+d+'/10<br><br>Thời gian: '+Math.round(elapsed)+'s<br>Doanh thu: +'+pay+' xu · Tip: +'+tip+' xu';$('overlay').classList.add('show');};
$('next').onclick=()=>{idx++;nextOrder()};setInterval(()=>{if(finished)return;const e=(Date.now()-started)/1000,r=recipe();$('timer').textContent='⏱ '+Math.round(e)+'s';$('bar').style.width=Math.max(0,100*(1-e/r.time))+'%';$('bar').style.background=e>r.time*.75?'#e17b73':'#8dd3ac';},250);
const canvas=$('scene'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function txt(s,x,y,c='#ffe1a5'){ctx.font='bold 8px monospace';ctx.fillStyle=c;ctx.fillText(s,x,y)}
function draw(){const t=Date.now()/1000;rect(0,0,320,185,'#292339');rect(0,0,320,64,'#352943');rect(12,8,296,6,'#69475a');rect(12,48,296,5,'#69475a');for(let x=18;x<305;x+=25){const c=['#b35d76','#d4a253','#73a79e','#a876a0'][Math.floor(x/25)%4];rect(x,20,11,25,c);rect(x+3,16,5,4,'#e5c58b');rect(x+2,29,7,3,'#ffffff44');}rect(0,64,320,7,'#bc805c');rect(0,71,320,42,'#64485b');rect(0,113,320,72,'#493647');rect(8,132,304,47,'#825d58');rect(8,132,304,8,'#d5a377');const bob=Math.sin(t*1.6);rect(135,68+bob,50,38,'#4b7368');rect(143,28+bob,35,32,'#d8a589');rect(140,22+bob,41,10,'#473041');rect(150,40+bob,4,4,'#332a39');rect(169,40+bob,4,4,'#332a39');rect(155,68+bob,9,25,'#e4c68d');rect(140,104+bob,40,5,'#243d45');rect(143,100,35,32,'#b7dce5');rect(146,103,29,26,'#2e394e');const entries=Object.entries(liquid),dominant=entries.sort((a,b)=>b[1]-a[1])[0]?.[0];if(total()){const level=Math.min(24,Math.round(total()/260*24));rect(146,129-level,29,level,colors[dominant]||'#e5a46e');rect(148,129-level,4,level,'#ffffff44');}rect(143,100,3,32,'#b7dce5');rect(175,100,3,32,'#b7dce5');if(ice)for(let i=0;i<3;i++)rect(149+i*8,121-i%2*5,6,5,'#e7f8ff');if(garnish){rect(173,98,12,5,colors[garnish]);rect(179,94,4,5,'#76b97c');}txt('LAST CALL',137,13);if(shake)txt('SHAKE '+shake,15,88);if(stir)txt('STIR '+stir,258,88);requestAnimationFrame(draw);}draw();nextOrder();
</script></body></html>
